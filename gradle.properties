org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=5

# 原 Windows 环境配置（在 Termux/Android 下会因路径不存在而直接构建失败，已停用）
# 如需在 Windows 上构建，请取消下面这行的注释并改成你自己的 JDK 路径
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.11.10-hotspot

minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.2
fabric_version=0.115.4+1.21.1

mod_version=1.0
maven_group=dev.luminous
archives_base_name=Fentanyl

# ---- Fabric Loom 国内镜像（BMCLAPI：Mojang 库 / 资源 / 版本清单）----
# 这几个属性会被 fabric-loom 读取，用来替换它内置的海外下载地址。
# 如果 BMCLAPI 不可用，注释掉下面三行即可恢复官方地址（libraries.minecraft.net 等）。
loom_libraries_base=https://bmclapi2.bangbang93.com/libraries/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json
